site_name: pytorch-world
site_description: World models library for PyTorch
site_url: https://latent-horizon.github.io/pytorch-world/
repo_url: https://github.com/latent-horizon/pytorch-world
repo_name: latent-horizon/pytorch-world
edit_uri: ""
copyright: © 2026 Latent Horizon

docs_dir: docs

theme:
  name: material
  custom_dir: overrides
  logo: assets/logo-white.png
  favicon: assets/logo-light.png
  icon:
    repo: fontawesome/brands/github
  font:
    text: Inter
    code: JetBrains Mono
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/weather-sunset
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/white-balance-sunny
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to system preference
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - navigation.instant
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - toc.follow

extra_css:
  - https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css
  - stylesheets/sunset.css

plugins:
  - search
  - mkdocs-jupyter:
      execute: false
      include_source: true
      ignore_h1_titles: true
  - mkdocstrings:
      handlers:
        python:
          paths: [.]
          options:
            docstring_style: google
            show_source: false
            show_root_heading: true
            show_root_full_path: false
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            show_signature_annotations: true
            separate_signature: true
            signature_crossrefs: true
            members_order: source
            merge_init_into_class: true
            filters: ["!^_"]
            heading_level: 2

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra_javascript:
  - javascripts/katex.js
  - javascripts/water.js
  - https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js
  - https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js

extra:
  generator: false
  footer:
    tagline: World models for PyTorch. Shared layers, objectives, planners and environments, so every model is short and easy to compare.
    install: uv add torch_world
    columns:
      - title: Learn
        links:
          - {name: Installation, url: getting-started/installation/}
          - {name: Quick start, url: getting-started/quickstart/}
          - {name: Concepts, url: getting-started/concepts/}
          - {name: Bring your own model, url: guides/custom-model/}
      - title: Models
        links:
          - {name: All models, url: models/}
          - {name: JEPA family, url: models/jepa/}
          - {name: LeWM, url: models/jepa/lewm/}
          - {name: LeWAM, url: models/jepa/lewam/}
          - {name: DINO-WM, url: models/jepa/dinowm/}
          - {name: RoboJEPA, url: models/jepa/robojepa/}
      - title: Build
        links:
          - {name: Environments, url: environments/}
          - {name: Datasets, url: datasets/}
          - {name: Planning, url: guides/planning/}
          - {name: Notebooks, url: examples/intro/}
          - {name: API reference, url: api/}
      - title: Project
        repo: true
        links:
          - {name: Contributing, url: contributing/}
          - {name: Apache 2.0 license, url: "https://www.apache.org/licenses/LICENSE-2.0"}
    legal:
      - {name: Released under the Apache 2.0 license, url: "https://www.apache.org/licenses/LICENSE-2.0"}

