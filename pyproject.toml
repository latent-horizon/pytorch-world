[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "torch-world"
dynamic = ["version"]
description = "World models library for PyTorch"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = ["torch>=2.1"]

[project.optional-dependencies]
examples = ["matplotlib"]
action = ["mujoco>=3.3"]
benchmark = ["mujoco==3.6.0"]
newton = ["newton>=1.7,<1.8"]
lewam = ["mujoco==3.15.0", "matplotlib", "pillow"]
sim2real = ["mujoco>=3.6,<3.7"]
so101 = [
    "mujoco>=3.6,<3.7",
    "opencv-python-headless>=4.9,<5",
    "lerobot[feetech]==0.6.1; python_version >= '3.12'",
]
test = ["pytest"]
notebooks = ["matplotlib", "nbclient", "nbformat", "ipykernel"]

[dependency-groups]
docs = [
    "mkdocs>=1.6,<2",
    "mkdocs-material>=9.6,<10",
    "mkdocstrings[python]>=0.29",
    "mkdocs-jupyter>=0.25",
    "ruff",
]

[tool.hatch.version]
path = "torch_world/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["torch_world"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.format]
# Code blocks in the docs and notebooks keep their hand-aligned comments.
exclude = ["*.md", "*.ipynb"]

[tool.ruff.lint.per-file-ignores]
"*.ipynb" = ["C408", "PLC0206"]

[tool.uv]
conflicts = [
    [{ extra = "lewam" }, { extra = "benchmark" }],
    [{ extra = "lewam" }, { extra = "sim2real" }],
    [{ extra = "lewam" }, { extra = "so101" }],
]
