[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "torch-world"
version = "0.1.0"
description = "World models library for PyTorch"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = ["torch>=2.1"]

[project.optional-dependencies]
examples = ["matplotlib"]
action = ["mujoco>=3.3"]
test = ["pytest"]

[dependency-groups]
docs = [
    "mkdocs>=1.6,<2",
    "mkdocs-material>=9.6,<10",
    "mkdocstrings[python]>=0.29",
    "mkdocs-jupyter>=0.25",
    "ruff",
]

[tool.hatch.build.targets.wheel]
packages = ["torch_world"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
