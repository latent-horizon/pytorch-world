[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "torch-world"
dynamic = ["version"]
description = "World models library for PyTorch"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = ["torch>=2.1"]

[project.optional-dependencies]
examples = ["matplotlib"]
action = ["mujoco>=3.3"]
lewam = ["mujoco==3.15.0", "matplotlib", "pillow"]
notebooks = ["matplotlib", "nbclient", "nbformat", "ipykernel"]
test = ["pytest"]

[dependency-groups]
docs = [
    "mkdocs>=1.6,<2",
    "mkdocs-material>=9.6,<10",
    "mkdocstrings[python]>=0.29",
    "mkdocs-jupyter>=0.25",
    "ruff",
]

[tool.hatch.version]
path = "torch_world/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["torch_world"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.format]
# Code blocks in the docs and notebooks keep their hand-aligned comments.
exclude = ["*.md", "*.ipynb"]

[tool.ruff.lint.per-file-ignores]
"*.ipynb" = ["C408", "PLC0206"]
