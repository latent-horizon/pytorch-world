[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "torch-world"
dynamic = ["version"]
description = "World models library for PyTorch"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = ["torch>=2.1"]

[project.optional-dependencies]
examples = ["matplotlib", "av"]
action = ["mujoco>=3.3"]
benchmark = ["mujoco==3.6.0"]
newton = ["newton>=1.7,<1.8"]
# OGBench needs dm_control, whose labmaze dependency publishes wheels only up to Python 3.12.
ogbench = ["ogbench>=1.2.1,<1.3; python_version < '3.13'"]
# dm_control needs labmaze, which publishes wheels only up to Python 3.12.
dmcontrol = ["dm_control>=1.0.20; python_version < '3.13'"]
metaworld = ["metaworld>=3.0"]
# On Linux, SAPIEN publishes wheels only for x86_64, and ManiSkill's mplib pin only up to Python 3.12.
maniskill = ["mani_skill>=3.0; sys_platform != 'linux' or (platform_machine == 'x86_64' and python_version < '3.13')"]
# MyoSuite 3 builds its models with MuJoCo's spec API from 3.7, past the benchmark pin.
myosuite = ["myosuite>=3.0", "mujoco>=3.7"]
robodojo = ["h5py"]
robocasa = ["pyarrow", "av"]
lewam = ["mujoco==3.15.0", "matplotlib", "pillow"]
notebooks = ["matplotlib", "av", "nbclient", "nbformat", "ipykernel"]
test = ["pytest", "pytest-xdist"]

[dependency-groups]
# The VitePress site (package.json) renders the API reference and notebooks with these.
docs = [
    "griffe>=1.5",
    "ruff",
]

[tool.hatch.version]
path = "torch_world/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["torch_world"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.format]
# Code blocks in the docs and notebooks keep their hand-aligned comments.
exclude = ["*.md", "*.ipynb"]

[tool.ruff.lint.per-file-ignores]
"*.ipynb" = ["C408", "PLC0206"]

[tool.uv]
conflicts = [[{ extra = "lewam" }, { extra = "benchmark" }], [{ extra = "myosuite" }, { extra = "benchmark" }]]
