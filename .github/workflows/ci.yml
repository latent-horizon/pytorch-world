name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  RUFF_VERSION: "0.17.0"
  UV_PYTHON_PREFERENCE: only-managed

jobs:
  quality:
    name: lint and package
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: Format
        run: uvx ruff@${RUFF_VERSION} format --check --output-format github .
      - name: Lint
        run: uvx ruff@${RUFF_VERSION} check --output-format github .
      - name: Build
        run: uv build
      - name: Check metadata
        run: uvx twine check --strict dist/*

  test:
    name: test (python ${{ matrix.python }}, torch ${{ matrix.torch }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # The two latest PyTorch releases, each on one end of the supported Python range. Bump on a new release.
        include:
          - python: "3.10"
            torch: "2.13"
          - python: "3.13"
            torch: "2.14"
    env:
      MUJOCO_GL: osmesa
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
          cache-dependency-glob: pyproject.toml
      - name: Install OSMesa and Mesa's Vulkan driver, for headless MuJoCo and SAPIEN rendering
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends libosmesa6 libvulkan1 mesa-vulkan-drivers
      - name: Cache robot models
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/torch_world
          key: menagerie-${{ hashFiles('torch_world/envs/robot_cube.py') }}
      - name: Install
        # CPU wheels of torch: a fraction of the size of the default CUDA build.
        run: |
          uv venv
          uv pip install --torch-backend cpu "torch==${{ matrix.torch }}.*" -e ".[test,examples,action,benchmark,newton,ogbench,robodojo,robocasa,notebooks,dmcontrol,metaworld,maniskill]"
      - name: Check the PyTorch version
        run: uv run --no-sync python -c "import torch; assert torch.__version__.startswith('${{ matrix.torch }}.'), torch.__version__"
      - name: Test
        # One worker per core; software rendering dominates, so tests run in parallel processes.
        run: uv run --no-sync pytest -q -n auto --durations=5

  myosuite:
    # MyoSuite needs MuJoCo 3.7 or later, past the benchmark pin, so it runs in its own environment.
    name: test (myosuite)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MUJOCO_GL: osmesa
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: pyproject.toml
      - name: Install OSMesa, for headless MuJoCo rendering
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends libosmesa6
      - name: Install
        run: |
          uv venv
          uv pip install --torch-backend cpu -e ".[test,myosuite]"
      - name: Test
        run: uv run --no-sync pytest -q tests/test_lanes.py

  macos:
    # Apple silicon, CPU and MPS: the core library, models, planners and the MuJoCo worlds.
    name: test (macos)
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: pyproject.toml
      - name: Install
        run: |
          uv venv
          uv pip install -e ".[test,examples,action]"
      - name: Test
        run: >-
          uv run --no-sync pytest -q -n auto tests/models tests/nn tests/test_planning.py tests/test_losses.py
          tests/test_masks.py tests/test_metrics.py tests/test_envs_datasets.py tests/test_evaluation.py tests/test_devices.py
