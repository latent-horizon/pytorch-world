name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  RUFF_VERSION: "0.17.0"
  UV_PYTHON_PREFERENCE: only-managed

jobs:
  quality:
    name: lint and package
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: Format
        run: uvx ruff@${RUFF_VERSION} format --check --output-format github .
      - name: Lint
        run: uvx ruff@${RUFF_VERSION} check --output-format github .
      - name: Build
        run: uv build
      - name: Check metadata
        run: uvx twine check --strict dist/*

  test:
    name: test (python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.13"]
    env:
      MUJOCO_GL: osmesa
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
          cache-dependency-glob: pyproject.toml
      - name: Install OSMesa, for headless MuJoCo rendering
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends libosmesa6
      - name: Cache robot models
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/torch_world
          key: menagerie-${{ hashFiles('torch_world/envs/robot_cube.py') }}
      - name: Install
        # CPU wheels of torch: a fraction of the size of the default CUDA build.
        run: |
          uv venv
          uv pip install --torch-backend cpu -e ".[test,examples,action,benchmark,newton,ogbench,robodojo,robocasa,notebooks]"
      - name: Test
        # One worker per core; software rendering dominates, so tests run in parallel processes.
        run: uv run --no-sync pytest -q -n auto --durations=5
